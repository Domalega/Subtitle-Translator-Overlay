name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows release
    uses: ./.github/workflows/windows-ci.yml
    with:
      release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified portable executable
        uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: release

      - name: Publish executable and checksum
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          executable="Subtitle-Translator-Overlay-${RELEASE_TAG#v}.exe"
          test -s "$executable"
          sha256sum "$executable" > SHA256SUMS.txt
          options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$executable" SHA256SUMS.txt "${options[@]}"
